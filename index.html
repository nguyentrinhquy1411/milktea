g-ink:#4a3000;--tier-kc:#E74345;--tier-kc-ink:#FBFCFC;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--safe-top:56px;--tap-min:44px;--tabbar-h:68px;--tabbar-inset:0px;--rail-w:84px;--rail-item-h:76px;--radius-xs:10px;--radius-sm:12px;--radius-md:16px;--radius-btn:999px;--radius-lg:20px;--radius-xl:28px;--radius-pill:999px;--shadow-float:0 8px 28px rgba(231,67,69,.16),0 1px 3px rgba(43,27,28,.06);--shadow-sheet:0 -8px 30px rgba(23,23,23,.08);--shadow-toast:0 4px 16px rgba(23,23,23,.14);--opacity-dim:0.45;--font-display:\"Shantell Sans\", \"Be Vietnam Pro\", system-ui, sans-serif;--font-sans:\"Be Vietnam Pro\", system-ui, sans-serif;}\n\n/*@TYPE-START@*/\n.cf { font-family: var(--font-sans); font-size: 14px; line-height: 20px; font-weight: 400; }\n.t-display-xl { font-family: var(--font-display); font-size: 38px; line-height: 40px; font-weight: 700; letter-spacing: -0.03em; }\n.t-display-l { font-family: var(--font-display); font-size: 32px; line-height: 36px; font-weight: 700; letter-spacing: -0.02em; }\n.t-display-m { font-family: var(--font-display); font-size: 26px; line-height: 30px; font-weight: 700; letter-spacing: -0.02em; }\n.t-title { font-family: var(--font-display); font-size: 21px; line-height: 26px; font-weight: 700; letter-spacing: -0.02em; }\n.t-title-s { font-family: var(--font-display); font-size: 18px; line-height: 22px; font-weight: 700; letter-spacing: -0.02em; }\n.t-numeral-xl { font-family: var(--font-display); font-size: 64px; line-height: 68px; font-weight: 700; letter-spacing: -0.04em; }\n.t-numeral-pickup { font-family: var(--font-display); font-size: 104px; line-height: 104px; font-weight: 700; letter-spacing: -0.05em; }\n.t-body-l { font-family: var(--font-sans); font-size: 16px; line-height: 24px; font-weight: 500; }\n.t-body { font-family: var(--font-sans); font-size: 14px; line-height: 20px; font-weight: 400; }\n.t-body-strong { font-family: var(--font-sans); font-size: 14px; line-height: 20px; font-weight: 600; }\n.t-body-s { font-family: var(--font-sans); font-size: 12.5px; line-height: 18px; font-weight: 400; }\n.t-label { font-family: var(--font-sans); font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }\n.t-caption { font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 600; }\n/*@TYPE-END@*/\n.cf, .cf * { box-sizing: border-box; }\n.cf { color: var(--ink); -webkit-font-smoothing: antialiased; }\n:where(.cf) :is(button, input, textarea), :where(button.cf) { font: inherit; color: inherit; }\n:where(.cf) button, :where(button.cf) { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; -webkit-tap-highlight-color: transparent; }\n:where(.cf) button:disabled, :where(button.cf):disabled { cursor: not-allowed; }\n.cf:focus-visible, .cf :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }\n.cf-muted { color: var(--ink-muted); }\n.cf-brand { color: var(--brand-text); }\n.cf-dim { opacity: var(--opacity-dim); }\n.cf-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }\n\n/* ---------- Motion vocabulary: mọi chuyển động đều là một đường line ---------- */\n.cf-press { transition: transform .3s cubic-bezier(.3,1.7,.5,1); }\n.cf-press:active { transform: scale(.94); }\n.cf-ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }\n.cf-ic.cf-filled { fill: currentColor; --vein: var(--surface); }\n.cf-replay { stroke-dasharray: 1; animation: cfDraw .9s cubic-bezier(.4,0,.2,1) both; }\n.cf-replay path, .cf-replay circle, .cf-replay rect { stroke-dasharray: 1; }\n@keyframes cfDraw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }\n@keyframes cfGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }\n@keyframes cfGrowY { from { transform: scaleY(0); } to { transform: scaleY(1); } }\n@keyframes cfRing { from { transform: scale(.4); opacity: 1; } to { transform: scale(2.2); opacity: 0; } }\n@keyframes cfSweep { 0% { transform: scaleX(0); opacity: 1; } 65% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }\n@keyframes cfFade { to { opacity: 0; } }\n@keyframes cfWait { 0% { stroke-dashoffset: 1; opacity: 1; } 35% { stroke-dashoffset: 0; opacity: 1; } 75% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }\n@keyframes cfScan { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(var(--scan, 100%)); } }\n.cf-sweep { position: absolute; left: 0; right: 0; top: 0; height: 2px; z-index: 95; pointer-events: none; background: var(--brand); transform-origin: 0 50%; animation: cfSweep .8s cubic-bezier(.3,.7,.2,1) both; }\n.cf-fly-ln { stroke-dasharray: 1; stroke-dashoffset: 1; animation: cfDraw .55s cubic-bezier(.5,0,.2,1) forwards, cfFade .35s .6s forwards; }\n.cf-fly-dot { animation: cfFade .3s .5s forwards; }\n.cf-fly-ring { transform-box: fill-box; transform-origin: center; opacity: 0; animation: cfRing .6s .5s ease-out both; }\n@media (prefers-reduced-motion: reduce) { .cf *, .cf *::before, .cf *::after, .cf { animation: none !important; transition: none !important; } }\n\n.cf-label { color: var(--ink-muted); }\n.cf-display { font-family: var(--font-display); }\n\n/* ---------- Button ---------- */\n.cf-btn { position: relative; display: flex; align-items: center; justify-content: center; gap: var(--space-3); white-space: nowrap; overflow: hidden; }\n.cf-btn-primary { height: 56px; padding: 0 var(--space-6); border-radius: var(--radius-btn); background: var(--brand); color: var(--on-brand); }\n.cf-btn-primary:disabled { background: var(--disabled-bg); color: var(--disabled-text); }\n.cf-btn-secondary { height: 48px; padding: 0 var(--space-5); border-radius: var(--radius-sm); border: 1px solid var(--line-strong); background: var(--surface); }\n.cf-btn-text { height: var(--tap-min); padding: 0 var(--space-2); color: var(--brand-text); }\n.cf-full { width: 100%; }\n.cf-btn-line { position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--brand); transform-origin: 0 50%; animation: cfGrow 1.7s linear both; }\n\n/* ---------- IconButton ---------- */\n.cf-iconbtn { position: relative; width: var(--tap-min); height: var(--tap-min); border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }\n.cf-badge { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 var(--space-1); border-radius: var(--radius-pill); background: var(--ink); color: var(--bg); display: grid; place-items: center; }\n\n/* ---------- Tag ---------- */\n.cf-tag { display: inline-flex; align-items: center; gap: var(--space-1); height: 20px; padding: 0 var(--space-2); border-radius: var(--radius-xs); white-space: nowrap; }\n.cf-tag-best, .cf-tag-ready { background: var(--brand-tint); color: var(--on-brand-tint); }\n.cf-tag-new, .cf-tag-sold { background: var(--ink); color: var(--bg); }\n.cf-tag-open, .cf-tag-closed, .cf-tag-neutral { height: 28px; padding: 0 var(--space-3); border-radius: var(--radius-pill); }\n.cf-tag-open { background: var(--ok-bg); color: var(--ok-text); }\n.cf-tag-closed, .cf-tag-neutral { background: var(--neutral-bg); color: var(--ink); }\n.cf-tag i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-muted); }\n.cf-tag-open i { background: var(--ok-dot); }\n\n/* ---------- Chip + Segmented ---------- */\n.cf-chip { position: relative; height: var(--tap-min); padding: 0 var(--space-3); border: 0; background: none; color: var(--ink-muted); display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; transition: color .2s, transform .3s cubic-bezier(.3,1.7,.5,1); }\n.cf-chip::after { content: \"\"; position: absolute; left: var(--space-3); right: var(--space-3)
